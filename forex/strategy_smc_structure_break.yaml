# Estratégia Forex — ICT/SMC + 3:1 RR
# Base: Market Structure + Liquidity + Order Blocks + FVG
# Killzones: London Open 05:00, NY Open 10:00, London Close 12:00 BRT

name: "SMC Structure Break 3:1"
timeframe: "M5"
higher_timeframe: "M15"  # confirmação de tendência

# ============================================================
# CONCEITOS
# ============================================================

conceitos:
  estrutura:
    tendencia_alta: "HH (Higher Highs) + HL (Higher Lows)"
    tendencia_baixa: "LH (Lower Highs) + LL (Lower Lows)"
    bos: "Break of Structure — rompimento de high/low confirmando tendência"
    choch: "Change of Character — rompimento na direção oposta (reversão)"
    
  liquidez:
    buy_side: "Acima das máximas anteriores (SL dos shorts = combustível)"
    sell_side: "Abaixo das mínimas anteriores (SL dos longs = combustível)"
    sweep: "Preço 'caça' liquidez antes de reverter — armadilha clássica"
    
  order_blocks:
    bullish_ob: "Último candle bearish ANTES de um impulso forte de alta"
    bearish_ob: "Último candle bullish ANTES de um impulso forte de baixa"
    
  fvg:
    definicao: "Fair Value Gap — 3 candles onde o do meio deixa gap"
    uso: "Preço retorna ao FVG para 'corrigir' antes de continuar"

# ============================================================
# REGRAS DE ENTRADA (em cada killzone)
# ============================================================

entrada_long:
  passo_1:
    nome: "Confirma tendência no M15"
    regra: "M15 fazendo HH + HL (tendência de alta)"
    
  passo_2:
    nome: "Espera sweep de liquidez"
    regra: "Preço rompe mínima anterior no M5 (caça sell-side liquidity)"
    
  passo_3:
    nome: "Confirma CHoCH (Change of Character)"
    regra: "Após sweep, candle seguinte fecha acima da máxima do candle de sweep"
    
  passo_4:
    nome: "Espera retorno ao Order Block ou FVG"
    regra: |
      Identifica o último candle bearish antes da virada.
      Espera preço retornar à zona do OB (high/low do candle).
      OU retornar ao FVG entre máximo do candle 1 e mínimo do candle 3.
    
  passo_5:
    nome: "Entrada + SL + TP"
    entrada: "No fechamento do candle que toca o OB/FVG"
    stop_loss: "Abaixo da mínima do sweep (liquidez já foi caçada)"
    take_profit: "3x a distância do SL → próxima liquidez buy-side"
    
entrada_short:
  passo_1:
    nome: "Confirma tendência no M15"
    regra: "M15 fazendo LH + LL (tendência de baixa)"
    
  passo_2:
    nome: "Espera sweep de liquidez"
    regra: "Preço rompe máxima anterior no M5 (caça buy-side liquidity)"
    
  passo_3:
    nome: "Confirma CHoCH"
    regra: "Após sweep, candle seguinte fecha abaixo da mínima do candle de sweep"
    
  passo_4:
    nome: "Espera retorno ao Order Block ou FVG"
    regra: |
      Identifica o último candle bullish antes da virada.
      Espera preço retornar à zona do OB.
      OU retornar ao FVG.
    
  passo_5:
    nome: "Entrada + SL + TP"
    entrada: "No fechamento do candle que toca o OB/FVG"
    stop_loss: "Acima da máxima do sweep"
    take_profit: "3x a distância do SL → próxima liquidez sell-side"

# ============================================================
# FILTROS ADICIONAIS
# ============================================================

filtros:
  - "NÃO entrar sem CHoCH confirmado (armadilha de sweep sem confirmação)"
  - "NÃO entrar se OB/FVG já foi testado 2x antes (perde força)"
  - "NÃO entrar se spread > 2 pips no par"
  - "NÃO entrar contra tendência do M15 (só a favor)"
  - "NÃO entrar se notícia de alto impacto em 5 min (ForexFactory red folder)"
  - "SIM entrar quando OB coincide com nível de Fibonacci 0.62-0.79"
  - "SIM entrar quando FVG é 'fresh' (não testado ainda)"

# ============================================================
# GESTÃO DE RISCO
# ============================================================

gestao:
  risco_por_trade: "1% do capital"
  rr_minimo: "3:1"
  max_trades_dia: "3 (1 por killzone)"
  max_loss_dia: "3% do capital (para o dia)"
  breakeven: "Move SL para entrada quando atinge 1.5R"
  trailing: "NÃO usar — deixa o 3R bater ou SL original"
  
# ============================================================
# HORÁRIOS (BRT)
# ============================================================

killzones:
  london_open:
    horario: "05:00-07:00"
    analise: "04:55"
    pares: ["EURUSD", "GBPUSD", "EURGBP"]
    
  ny_open:
    horario: "10:00-12:00"
    analise: "09:55"
    pares: ["EURUSD", "GBPUSD", "USDJPY"]
    
  london_close:
    horario: "12:00-14:00"
    analise: "11:55"
    pares: ["EURUSD", "EURJPY", "USDJPY"]
